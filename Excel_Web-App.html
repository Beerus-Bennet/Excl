<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Web Excel Studio Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for XLSX parsing and generation -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Smooth scrolling and prevent touch bounce */
        html, body {
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Inter', sans-serif;
        }

        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0,0,0,0.3);
        }

        /* Spreadsheet Grid Styles */
        .grid-header {
            background-color: #f3f4f6;
            user-select: none;
        }
        .dark .grid-header {
            background-color: #1f2937;
        }

        .cell-selected {
            outline: 2px solid #10b981 !important;
            outline-offset: -2px;
            z-index: 10;
        }

        .cell-range {
            background-color: rgba(16, 185, 129, 0.15) !important;
        }

        /* Hide inputs arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        /* Mobile touch responsiveness fixes */
        .touch-action-none {
            touch-action: none;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 flex flex-col h-full select-none overflow-hidden">

    <!-- Top Header Navigation Bar -->
    <header class="bg-emerald-700 dark:bg-emerald-900 text-white flex items-center justify-between px-3 py-2 shadow-md shrink-0">
        <div class="flex items-center space-x-3">
            <div class="flex items-center justify-center bg-white text-emerald-700 w-8 h-8 rounded-lg font-bold text-lg shadow">
                <i class="fa-solid fa-file-excel"></i>
            </div>
            <div>
                <input id="doc-title" type="text" value="Unbenannte Tabelle" class="bg-transparent text-white font-semibold focus:outline-none focus:bg-emerald-800/50 rounded px-1 text-base w-40 sm:w-64 border border-transparent hover:border-emerald-500/50 transition">
                <p class="text-xs text-emerald-200 hidden sm:block">Web Excel Studio Pro • Online & Offline</p>
            </div>
        </div>

        <!-- Header Actions & File Management -->
        <div class="flex items-center space-x-1 sm:space-x-2">
            <!-- File Import Trigger -->
            <label class="cursor-pointer bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium flex items-center space-x-1 transition shadow-sm active:scale-95">
                <i class="fa-solid fa-folder-open"></i>
                <span class="hidden sm:inline">Öffnen</span>
                <input type="file" id="file-input" accept=".xlsx, .csv" class="hidden">
            </label>

            <!-- File Export Trigger -->
            <button onclick="openExportModal()" class="bg-white text-emerald-800 hover:bg-emerald-50 px-2.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold flex items-center space-x-1 transition shadow-sm active:scale-95">
                <i class="fa-solid fa-download"></i>
                <span>Speichern</span>
            </button>

            <!-- Pivot Table Action -->
            <button onclick="openPivotModal()" class="bg-emerald-800 hover:bg-emerald-900 text-white px-2.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium flex items-center space-x-1 transition shadow-sm active:scale-95 border border-emerald-600">
                <i class="fa-solid fa-chart-pie"></i>
                <span class="hidden md:inline">Pivot-Tabelle</span>
            </button>

            <!-- Dark Mode Toggle -->
            <button id="theme-toggle" onclick="toggleDarkMode()" class="p-2 text-emerald-100 hover:text-white rounded-lg hover:bg-emerald-800/50 transition">
                <i class="fa-solid fa-moon text-base"></i>
            </button>
        </div>
    </header>

    <!-- Formatting Toolbar -->
    <div class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-2 py-1.5 flex items-center space-x-1 sm:space-x-2 overflow-x-auto shrink-0 shadow-xs">
        <!-- Undo / Redo -->
        <div class="flex items-center border-r border-gray-300 dark:border-gray-600 pr-1 sm:pr-2">
            <button onclick="undo()" class="p-1.5 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded active:bg-gray-200" title="Rückgängig"><i class="fa-solid fa-rotate-left text-xs"></i></button>
            <button onclick="redo()" class="p-1.5 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded active:bg-gray-200" title="Wiederholen"><i class="fa-solid fa-rotate-right text-xs"></i></button>
        </div>

        <!-- Font Formatting -->
        <div class="flex items-center space-x-0.5 border-r border-gray-300 dark:border-gray-600 pr-1 sm:pr-2">
            <button onclick="toggleFormat('bold')" id="btn-bold" class="p-1.5 min-w-[28px] text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 font-bold rounded text-xs" title="Fett">B</button>
            <button onclick="toggleFormat('italic')" id="btn-italic" class="p-1.5 min-w-[28px] text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 italic rounded text-xs" title="Kursiv">I</button>
        </div>

        <!-- Font Size & Colors -->
        <div class="flex items-center space-x-1 border-r border-gray-300 dark:border-gray-600 pr-1 sm:pr-2">
            <select id="font-size" onchange="applyFontSize(this.value)" class="text-xs bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded px-1 py-1 focus:outline-none">
                <option value="12px">12px</option>
                <option value="14px" selected>14px</option>
                <option value="16px">16px</option>
                <option value="18px">18px</option>
                <option value="20px">20px</option>
            </select>

            <!-- Text Color -->
            <label class="p-1.5 hover:bg-gray-100 dark:hover:bg-gray-700 rounded cursor-pointer flex items-center justify-center relative">
                <i class="fa-solid fa-font text-xs text-gray-700 dark:text-gray-200"></i>
                <input type="color" id="text-color" onchange="applyTextColor(this.value)" class="absolute opacity-0 w-full h-full cursor-pointer">
            </label>

            <!-- Fill Color -->
            <label class="p-1.5 hover:bg-gray-100 dark:hover:bg-gray-700 rounded cursor-pointer flex items-center justify-center relative">
                <i class="fa-solid fa-fill-drip text-xs text-gray-700 dark:text-gray-200"></i>
                <input type="color" id="fill-color" onchange="applyFillColor(this.value)" value="#ffffff" class="absolute opacity-0 w-full h-full cursor-pointer">
            </label>
        </div>

        <!-- Alignment -->
        <div class="flex items-center space-x-0.5 border-r border-gray-300 dark:border-gray-600 pr-1 sm:pr-2">
            <button onclick="applyAlign('left')" class="p-1.5 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded"><i class="fa-solid fa-align-left text-xs"></i></button>
            <button onclick="applyAlign('center')" class="p-1.5 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded"><i class="fa-solid fa-align-center text-xs"></i></button>
            <button onclick="applyAlign('right')" class="p-1.5 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded"><i class="fa-solid fa-align-right text-xs"></i></button>
        </div>

        <!-- Search / Sort Tools -->
        <div class="flex items-center space-x-1">
            <button onclick="sortColumn('asc')" class="p-1.5 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded text-xs flex items-center gap-1" title="Sortieren A-Z"><i class="fa-solid fa-arrow-down-a-z"></i></button>
            <button onclick="sortColumn('desc')" class="p-1.5 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded text-xs flex items-center gap-1" title="Sortieren Z-A"><i class="fa-solid fa-arrow-up-z-a"></i></button>
            <button onclick="openSearchModal()" class="p-1.5 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded text-xs" title="Suchen und Ersetzen"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
    </div>

    <!-- Formula Bar Component -->
    <div class="bg-gray-50 dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-2 py-1 flex items-center space-x-2 shrink-0">
        <div id="active-cell-id" class="w-12 text-center font-mono font-semibold text-xs text-gray-600 dark:text-gray-300 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded py-1">
            A1
        </div>
        <div class="text-gray-400 font-serif italic text-sm font-bold select-none">fx</div>
        <input id="formula-input" type="text" placeholder="Wert oder Formel eingeben (z.B. =SUMME(A1:A5))" class="flex-1 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded px-2 py-1 text-sm text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-emerald-500">
    </div>

    <!-- Main Interactive Grid Area -->
    <main class="flex-1 overflow-auto relative bg-white dark:bg-gray-900" id="grid-container">
        <table id="spreadsheet" class="border-collapse table-fixed w-full text-sm">
            <thead id="grid-head">
                <!-- Dynamically generated headers -->
            </thead>
            <tbody id="grid-body">
                <!-- Dynamically generated rows -->
            </tbody>
        </table>
    </main>

    <!-- Bottom Sheet Tabs & Quick Stats Bar -->
    <footer class="bg-gray-100 dark:bg-gray-800 border-t border-gray-300 dark:border-gray-700 flex flex-wrap items-center justify-between px-2 py-1 shrink-0 text-xs text-gray-600 dark:text-gray-300">
        <!-- Sheet Tabs -->
        <div class="flex items-center space-x-1 overflow-x-auto max-w-full py-0.5" id="sheet-tabs-container">
            <div id="sheet-tabs" class="flex items-center space-x-1">
                <!-- Sheet tabs loaded dynamically -->
            </div>
            <button onclick="addNewSheet()" class="p-1 text-gray-500 hover:text-emerald-600 hover:bg-gray-200 dark:hover:bg-gray-700 rounded transition" title="Neues Blatt"><i class="fa-solid fa-plus"></i></button>
        </div>

        <!-- Quick Stats Footer -->
        <div class="flex items-center space-x-3 ml-auto text-xs py-0.5">
            <div>Anzahl: <span id="stat-count" class="font-medium">0</span></div>
            <div>Summe: <span id="stat-sum" class="font-medium">0</span></div>
            <div class="hidden sm:block">Mittelwert: <span id="stat-avg" class="font-medium">0</span></div>
        </div>
    </footer>

    <!-- Floating Action Button for Easy Mobile Download -->
    <button onclick="openExportModal()" class="sm:hidden fixed bottom-12 right-4 bg-emerald-600 text-white w-12 h-12 rounded-full shadow-lg flex items-center justify-center text-xl z-30 active:scale-90 transition-transform">
        <i class="fa-solid fa-file-arrow-down"></i>
    </button>

    <!-- Pivot Table Modal -->
    <div id="pivot-modal" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-3">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden">
            <div class="bg-emerald-700 text-white px-4 py-3 flex items-center justify-between">
                <h3 class="font-bold flex items-center gap-2"><i class="fa-solid fa-chart-pie"></i> Pivottabelle erstellen</h3>
                <button onclick="closePivotModal()" class="text-emerald-200 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-4 overflow-y-auto space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 dark:text-gray-300 mb-1">Zeilen-Gruppe (Row Header)</label>
                        <select id="pivot-row-select" class="w-full text-sm bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded p-2"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 dark:text-gray-300 mb-1">Werte-Spalte (Value Field)</label>
                        <select id="pivot-val-select" class="w-full text-sm bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded p-2"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 dark:text-gray-300 mb-1">Aggregationsfunktion</label>
                        <select id="pivot-func-select" class="w-full text-sm bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded p-2">
                            <option value="SUM">SUMME</option>
                            <option value="AVG">DURCHSCHNITT</option>
                            <option value="COUNT">ANZAHL</option>
                            <option value="MIN">MINIMUM</option>
                            <option value="MAX">MAXIMUM</option>
                        </select>
                    </div>
                </div>

                <button onclick="generatePivotTable()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg font-semibold text-sm transition">
                    Pivottabelle berechnen
                </button>

                <!-- Pivot Result Output Table -->
                <div id="pivot-result-container" class="mt-4 border border-gray-200 dark:border-gray-700 rounded-lg overflow-x-auto hidden">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-gray-100 dark:bg-gray-700 font-bold border-b dark:border-gray-600" id="pivot-result-head"></thead>
                        <tbody id="pivot-result-body"></tbody>
                    </table>
                </div>
            </div>
            <div class="bg-gray-50 dark:bg-gray-700 px-4 py-2 border-t border-gray-200 dark:border-gray-600 flex justify-between items-center">
                <button id="pivot-export-btn" onclick="exportPivotToSheet()" class="hidden text-xs bg-emerald-600 text-white px-3 py-1.5 rounded hover:bg-emerald-700 font-medium">Als neues Blatt einfügen</button>
                <button onclick="closePivotModal()" class="text-xs bg-gray-300 dark:bg-gray-600 text-gray-700 dark:text-gray-200 px-3 py-1.5 rounded hover:bg-gray-400 ml-auto">Schließen</button>
            </div>
        </div>
    </div>

    <!-- Export Modal -->
    <div id="export-modal" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-3">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl w-full max-w-sm overflow-hidden">
            <div class="bg-emerald-700 text-white px-4 py-3 flex items-center justify-between">
                <h3 class="font-bold flex items-center gap-2"><i class="fa-solid fa-download"></i> Datei Speichern</h3>
                <button onclick="closeExportModal()" class="text-emerald-200 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-4 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-600 dark:text-gray-300 mb-1">Dateiname</label>
                    <input type="text" id="export-filename" class="w-full text-sm bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded p-2" value="Meine_Tabelle">
                </div>

                <div class="space-y-2">
                    <label class="block text-xs font-bold text-gray-600 dark:text-gray-300">Format wählen</label>
                    <button onclick="triggerDownload('xlsx')" class="w-full flex items-center justify-between bg-gray-50 dark:bg-gray-700 hover:bg-emerald-50 dark:hover:bg-emerald-900/30 border border-gray-300 dark:border-gray-600 p-3 rounded-lg text-left transition group">
                        <div class="flex items-center space-x-3">
                            <i class="fa-solid fa-file-excel text-emerald-600 text-xl"></i>
                            <div>
                                <div class="font-bold text-sm">Excel-Arbeitsmappe</div>
                                <div class="text-xs text-gray-500 dark:text-gray-400">Standard `.xlsx` Datei</div>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-gray-400 group-hover:text-emerald-600"></i>
                    </button>

                    <button onclick="triggerDownload('csv')" class="w-full flex items-center justify-between bg-gray-50 dark:bg-gray-700 hover:bg-emerald-50 dark:hover:bg-emerald-900/30 border border-gray-300 dark:border-gray-600 p-3 rounded-lg text-left transition group">
                        <div class="flex items-center space-x-3">
                            <i class="fa-solid fa-file-csv text-blue-600 text-xl"></i>
                            <div>
                                <div class="font-bold text-sm">CSV-Datei</div>
                                <div class="text-xs text-gray-500 dark:text-gray-400">Kommagetrennter Text `.csv`</div>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-gray-400 group-hover:text-emerald-600"></i>
                    </button>
                </div>
            </div>
            <div class="bg-gray-50 dark:bg-gray-700 px-4 py-2 border-t border-gray-200 dark:border-gray-600 text-right">
                <button onclick="closeExportModal()" class="text-xs bg-gray-300 dark:bg-gray-600 text-gray-700 dark:text-gray-200 px-3 py-1.5 rounded hover:bg-gray-400">Abbrechen</button>
            </div>
        </div>
    </div>

    <!-- Search Modal -->
    <div id="search-modal" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-3">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl w-full max-w-sm overflow-hidden">
            <div class="bg-emerald-700 text-white px-4 py-3 flex items-center justify-between">
                <h3 class="font-bold flex items-center gap-2"><i class="fa-solid fa-magnifying-glass"></i> Suchen & Ersetzen</h3>
                <button onclick="closeSearchModal()" class="text-emerald-200 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-4 space-y-3">
                <div>
                    <label class="block text-xs font-bold text-gray-600 dark:text-gray-300 mb-1">Suchen nach</label>
                    <input type="text" id="search-term" class="w-full text-sm bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded p-2">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 dark:text-gray-300 mb-1">Ersetzen durch</label>
                    <input type="text" id="replace-term" class="w-full text-sm bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded p-2">
                </div>
                <div class="flex space-x-2 pt-2">
                    <button onclick="performSearch()" class="flex-1 bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-gray-100 py-2 rounded text-xs font-semibold">Suchen</button>
                    <button onclick="performReplace()" class="flex-1 bg-emerald-600 text-white py-2 rounded text-xs font-semibold">Ersetzen</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Application Global State
        const INITIAL_ROWS = 50;
        const INITIAL_COLS = 20;

        let sheets = {
            'Blatt 1': createEmptySheet()
        };
        let activeSheetName = 'Blatt 1';
        let activeCell = { r: 0, c: 0 };
        let selectionEnd = { r: 0, c: 0 };
        let isSelecting = false;
        let undoStack = [];
        let redoStack = [];

        // Helper to generate blank sheet matrix
        function createEmptySheet() {
            let data = {};
            return {
                data: data,
                formatting: {}
            };
        }

        // Initialize Application
        window.onload = function() {
            renderHeaders();
            renderGrid();
            renderTabs();
            setupEventListeners();
            loadSampleData();
        };

        // Convert Column Index to Letter (0 -> A, 25 -> Z, 26 -> AA)
        function colToLetter(col) {
            let temp, letter = '';
            while (col >= 0) {
                temp = col % 26;
                letter = String.fromCharCode(temp + 65) + letter;
                col = Math.floor(col / 26) - 1;
            }
            return letter;
        }

        // Convert Letter to Column Index (A -> 0, Z -> 25)
        function letterToCol(letter) {
            let column = 0;
            for (let i = 0; i < letter.length; i++) {
                column += (letter.charCodeAt(i) - 64) * Math.pow(26, letter.length - i - 1);
            }
            return column - 1;
        }

        // Render Column Headers (A, B, C...)
        function renderHeaders() {
            const thead = document.getElementById('grid-head');
            let html = '<tr><th class="w-10 min-w-[40px] border border-gray-300 dark:border-gray-700 grid-header text-center text-xs font-normal text-gray-500 py-1"></th>';
            for (let c = 0; c < INITIAL_COLS; c++) {
                html += `<th class="w-24 min-w-[96px] border border-gray-300 dark:border-gray-700 grid-header text-center text-xs font-semibold text-gray-600 dark:text-gray-300 py-1">${colToLetter(c)}</th>`;
            }
            html += '</tr>';
            thead.innerHTML = html;
        }

        // Render Table Body Rows and Cells
        function renderGrid() {
            const tbody = document.getElementById('grid-body');
            const currentSheet = sheets[activeSheetName];
            let html = '';

            for (let r = 0; r < INITIAL_ROWS; r++) {
                html += `<tr><td class="border border-gray-300 dark:border-gray-700 grid-header text-center text-xs font-normal text-gray-500">${r + 1}</td>`;
                for (let c = 0; c < INITIAL_COLS; c++) {
                    const cellKey = `${r}_${c}`;
                    const rawVal = currentSheet.data[cellKey] || '';
                    const displayVal = evaluateCell(rawVal);
                    const style = currentSheet.formatting[cellKey] || {};

                    let styleAttr = '';
                    if (style.bold) styleAttr += 'font-weight: bold;';
                    if (style.italic) styleAttr += 'font-style: italic;';
                    if (style.fontSize) styleAttr += `font-size: ${style.fontSize};`;
                    if (style.color) styleAttr += `color: ${style.color};`;
                    if (style.backgroundColor) styleAttr += `background-color: ${style.backgroundColor};`;
                    if (style.textAlign) styleAttr += `text-align: ${style.textAlign};`;

                    html += `<td data-row="${r}" data-col="${c}" style="${styleAttr}" class="cell border border-gray-200 dark:border-gray-800 px-1.5 py-1 text-xs truncate max-w-0 cursor-pointer transition-colors duration-75">${displayVal}</td>`;
                }
                html += '</tr>';
            }
            tbody.innerHTML = html;
            updateCellSelection();
        }

        // Evaluate Cell Values & Formulas
        function evaluateCell(value) {
            if (typeof value !== 'string' || !value.startsWith('=')) {
                return value;
            }

            try {
                const formula = value.substring(1).toUpperCase();
                
                // Handled Formula Patterns
                if (formula.startsWith('SUMME(') || formula.startsWith('SUM(')) {
                    return calcRange(formula, vals => vals.reduce((a, b) => a + b, 0));
                }
                if (formula.startsWith('DURCHSCHNITT(') || formula.startsWith('AVERAGE(')) {
                    return calcRange(formula, vals => vals.length ? (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(2) : 0);
                }
                if (formula.startsWith('ANZAHL(') || formula.startsWith('COUNT(')) {
                    return calcRange(formula, vals => vals.length);
                }
                if (formula.startsWith('MIN(')) {
                    return calcRange(formula, vals => vals.length ? Math.min(...vals) : 0);
                }
                if (formula.startsWith('MAX(')) {
                    return calcRange(formula, vals => vals.length ? Math.max(...vals) : 0);
                }

                // Simple Math Arithmetic Evaluation (=A1+B1 or =A1*10)
                let parsedFormula = formula.replace(/([A-Z]+)(\d+)/g, (match, p1, p2) => {
                    const c = letterToCol(p1);
                    const r = parseInt(p2) - 1;
                    const cellKey = `${r}_${c}`;
                    const val = sheets[activeSheetName].data[cellKey];
                    const num = parseFloat(val);
                    return isNaN(num) ? 0 : num;
                });

                return eval(parsedFormula);
            } catch (err) {
                return '#FEHLER!';
            }
        }

        // Helper to compute math operations on cell ranges (e.g. A1:B5)
        function calcRange(formula, callback) {
            const rangeMatch = formula.match(/\((.*?)\)/);
            if (!rangeMatch) return 0;
            
            const rangeStr = rangeMatch[1];
            const parts = rangeStr.split(':');
            let values = [];

            if (parts.length === 2) {
                const startMatch = parts[0].match(/([A-Z]+)(\d+)/);
                const endMatch = parts[1].match(/([A-Z]+)(\d+)/);

                if (startMatch && endMatch) {
                    const startCol = letterToCol(startMatch[1]);
                    const startRow = parseInt(startMatch[2]) - 1;
                    const endCol = letterToCol(endMatch[1]);
                    const endRow = parseInt(endMatch[2]) - 1;

                    for (let r = Math.min(startRow, endRow); r <= Math.max(startRow, endRow); r++) {
                        for (let c = Math.min(startCol, endCol); c <= Math.max(startCol, endCol); c++) {
                            const val = sheets[activeSheetName].data[`${r}_${c}`];
                            const num = parseFloat(val);
                            if (!isNaN(num)) values.push(num);
                        }
                    }
                }
            }
            return callback(values);
        }

        // Setup Grid Selection & Mobile Touch
        function setupEventListeners() {
            const tbody = document.getElementById('grid-body');
            const formulaInput = document.getElementById('formula-input');

            // Cell Pointer Events
            tbody.addEventListener('mousedown', (e) => {
                if (!e.target.classList.contains('cell')) return;
                isSelecting = true;
                const r = parseInt(e.target.dataset.row);
                const c = parseInt(e.target.dataset.col);
                activeCell = { r, c };
                selectionEnd = { r, c };
                updateCellSelection();
            });

            tbody.addEventListener('mouseover', (e) => {
                if (!isSelecting || !e.target.classList.contains('cell')) return;
                const r = parseInt(e.target.dataset.row);
                const c = parseInt(e.target.dataset.col);
                selectionEnd = { r, c };
                updateCellSelection();
            });

            window.addEventListener('mouseup', () => {
                isSelecting = false;
            });

            // Double Click to Edit Direct Cell
            tbody.addEventListener('dblclick', (e) => {
                if (!e.target.classList.contains('cell')) return;
                makeCellEditable(e.target);
            });

            // Formula Bar Sync
            formulaInput.addEventListener('input', (e) => {
                saveState();
                const key = `${activeCell.r}_${activeCell.c}`;
                sheets[activeSheetName].data[key] = e.target.value;
                renderGrid();
            });

            formulaInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    focusNextCell();
                }
            });
        }

        // Direct Cell Inline Editing
        function makeCellEditable(td) {
            const r = parseInt(td.dataset.row);
            const c = parseInt(td.dataset.col);
            const key = `${r}_${c}`;
            const rawVal = sheets[activeSheetName].data[key] || '';

            td.innerHTML = `<input type="text" class="w-full h-full bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 outline-none px-1" value="${rawVal}">`;
            const input = td.querySelector('input');
            input.focus();

            input.addEventListener('blur', () => {
                saveState();
                sheets[activeSheetName].data[key] = input.value;
                renderGrid();
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    input.blur();
                    focusNextCell();
                }
            });
        }

        // Update UI Visual Highlights for Active Cell & Selection Ranges
        function updateCellSelection() {
            document.querySelectorAll('.cell').forEach(td => {
                td.classList.remove('cell-selected', 'cell-range');
            });

            const minR = Math.min(activeCell.r, selectionEnd.r);
            const maxR = Math.max(activeCell.r, selectionEnd.r);
            const minC = Math.min(activeCell.c, selectionEnd.c);
            const maxC = Math.max(activeCell.c, selectionEnd.c);

            let count = 0;
            let sum = 0;

            for (let r = minR; r <= maxR; r++) {
                for (let c = minC; c <= maxC; c++) {
                    const td = document.querySelector(`td[data-row="${r}"][data-col="${c}"]`);
                    if (td) {
                        if (r === activeCell.r && c === activeCell.c) {
                            td.classList.add('cell-selected');
                        } else {
                            td.classList.add('cell-range');
                        }

                        const rawVal = sheets[activeSheetName].data[`${r}_${c}`];
                        const val = parseFloat(evaluateCell(rawVal));
                        if (!isNaN(val)) {
                            sum += val;
                            count++;
                        }
                    }
                }
            }

            // Sync Formula Bar Display
            const cellId = `${colToLetter(activeCell.c)}${activeCell.r + 1}`;
            document.getElementById('active-cell-id').innerText = cellId;
            const currentVal = sheets[activeSheetName].data[`${activeCell.r}_${activeCell.c}`] || '';
            document.getElementById('formula-input').value = currentVal;

            // Sync Footer Quick Stats
            document.getElementById('stat-count').innerText = count;
            document.getElementById('stat-sum').innerText = sum.toFixed(2);
            document.getElementById('stat-avg').innerText = count > 0 ? (sum / count).toFixed(2) : '0';
        }

        function focusNextCell() {
            if (activeCell.r < INITIAL_ROWS - 1) {
                activeCell.r++;
                selectionEnd = { ...activeCell };
                updateCellSelection();
            }
        }

        // Save History Stack for Undo/Redo
        function saveState() {
            undoStack.push(JSON.stringify(sheets));
            redoStack = [];
        }

        function undo() {
            if (undoStack.length === 0) return;
            redoStack.push(JSON.stringify(sheets));
            sheets = JSON.parse(undoStack.pop());
            renderGrid();
        }

        function redo() {
            if (redoStack.length === 0) return;
            undoStack.push(JSON.stringify(sheets));
            sheets = JSON.parse(redoStack.pop());
            renderGrid();
        }

        // Formatting Toggles
        function toggleFormat(type) {
            saveState();
            const key = `${activeCell.r}_${activeCell.c}`;
            if (!sheets[activeSheetName].formatting[key]) sheets[activeSheetName].formatting[key] = {};
            
            if (type === 'bold') sheets[activeSheetName].formatting[key].bold = !sheets[activeSheetName].formatting[key].bold;
            if (type === 'italic') sheets[activeSheetName].formatting[key].italic = !sheets[activeSheetName].formatting[key].italic;
            
            renderGrid();
        }

        function applyFontSize(size) {
            saveState();
            const key = `${activeCell.r}_${activeCell.c}`;
            if (!sheets[activeSheetName].formatting[key]) sheets[activeSheetName].formatting[key] = {};
            sheets[activeSheetName].formatting[key].fontSize = size;
            renderGrid();
        }

        function applyTextColor(color) {
            saveState();
            const key = `${activeCell.r}_${activeCell.c}`;
            if (!sheets[activeSheetName].formatting[key]) sheets[activeSheetName].formatting[key] = {};
            sheets[activeSheetName].formatting[key].color = color;
            renderGrid();
        }

        function applyFillColor(color) {
            saveState();
            const key = `${activeCell.r}_${activeCell.c}`;
            if (!sheets[activeSheetName].formatting[key]) sheets[activeSheetName].formatting[key] = {};
            sheets[activeSheetName].formatting[key].backgroundColor = color;
            renderGrid();
        }

        function applyAlign(align) {
            saveState();
            const key = `${activeCell.r}_${activeCell.c}`;
            if (!sheets[activeSheetName].formatting[key]) sheets[activeSheetName].formatting[key] = {};
            sheets[activeSheetName].formatting[key].textAlign = align;
            renderGrid();
        }

        // Sort Selected Column
        function sortColumn(direction) {
            saveState();
            const col = activeCell.c;
            let rowsData = [];

            for (let r = 0; r < INITIAL_ROWS; r++) {
                rowsData.push({
                    rowIdx: r,
                    val: sheets[activeSheetName].data[`${r}_${col}`] || ''
                });
            }

            rowsData.sort((a, b) => {
                const numA = parseFloat(a.val);
                const numB = parseFloat(b.val);
                if (!isNaN(numA) && !isNaN(numB)) {
                    return direction === 'asc' ? numA - numB : numB - numA;
                }
                return direction === 'asc' ? a.val.localeCompare(b.val) : b.val.localeCompare(a.val);
            });

            let newData = {};
            rowsData.forEach((item, newRowIdx) => {
                for (let c = 0; c < INITIAL_COLS; c++) {
                    const oldKey = `${item.rowIdx}_${c}`;
                    const newKey = `${newRowIdx}_${c}`;
                    if (sheets[activeSheetName].data[oldKey]) {
                        newData[newKey] = sheets[activeSheetName].data[oldKey];
                    }
                }
            });

            sheets[activeSheetName].data = newData;
            renderGrid();
        }

        // Search Modals
        function openSearchModal() { document.getElementById('search-modal').classList.remove('hidden'); }
        function closeSearchModal() { document.getElementById('search-modal').classList.add('hidden'); }

        function performSearch() {
            const term = document.getElementById('search-term').value.toLowerCase();
            if (!term) return;

            for (let r = 0; r < INITIAL_ROWS; r++) {
                for (let c = 0; c < INITIAL_COLS; c++) {
                    const val = (sheets[activeSheetName].data[`${r}_${c}`] || '').toString().toLowerCase();
                    if (val.includes(term)) {
                        activeCell = { r, c };
                        selectionEnd = { r, c };
                        updateCellSelection();
                        closeSearchModal();
                        return;
                    }
                }
            }
            alert('Kein Ergebnis gefunden.');
        }

        function performReplace() {
            saveState();
            const term = document.getElementById('search-term').value;
            const replaceVal = document.getElementById('replace-term').value;
            if (!term) return;

            for (let r = 0; r < INITIAL_ROWS; r++) {
                for (let c = 0; c < INITIAL_COLS; c++) {
                    const key = `${r}_${c}`;
                    if (sheets[activeSheetName].data[key] === term) {
                        sheets[activeSheetName].data[key] = replaceVal;
                    }
                }
            }
            renderGrid();
            closeSearchModal();
        }

        // Pivot Table Modal Logic
        function openPivotModal() {
            const rowSelect = document.getElementById('pivot-row-select');
            const valSelect = document.getElementById('pivot-val-select');
            
            rowSelect.innerHTML = '';
            valSelect.innerHTML = '';

            for (let c = 0; c < INITIAL_COLS; c++) {
                const headerVal = sheets[activeSheetName].data[`0_${c}`] || `Spalte ${colToLetter(c)}`;
                rowSelect.innerHTML += `<option value="${c}">${headerVal}</option>`;
                valSelect.innerHTML += `<option value="${c}">${headerVal}</option>`;
            }

            document.getElementById('pivot-modal').classList.remove('hidden');
        }

        function closePivotModal() {
            document.getElementById('pivot-modal').classList.add('hidden');
        }

        let currentPivotResult = null;

        function generatePivotTable() {
            const rowCol = parseInt(document.getElementById('pivot-row-select').value);
            const valCol = parseInt(document.getElementById('pivot-val-select').value);
            const func = document.getElementById('pivot-func-select').value;

            let groups = {};

            for (let r = 1; r < INITIAL_ROWS; r++) {
                const groupKey = sheets[activeSheetName].data[`${r}_${rowCol}`];
                const valRaw = sheets[activeSheetName].data[`${r}_${valCol}`];
                const val = parseFloat(valRaw);

                if (groupKey !== undefined && groupKey !== '') {
                    if (!groups[groupKey]) groups[groupKey] = [];
                    if (!isNaN(val)) groups[groupKey].push(val);
                }
            }

            const head = document.getElementById('pivot-result-head');
            const body = document.getElementById('pivot-result-body');
            const rowHeaderName = sheets[activeSheetName].data[`0_${rowCol}`] || `Spalte ${colToLetter(rowCol)}`;
            const valHeaderName = sheets[activeSheetName].data[`0_${valCol}`] || `Spalte ${colToLetter(valCol)}`;

            head.innerHTML = `<tr><th class="p-2 border-b dark:border-gray-600">${rowHeaderName}</th><th class="p-2 border-b dark:border-gray-600">${func} von ${valHeaderName}</th></tr>`;
            body.innerHTML = '';

            currentPivotResult = [
                [rowHeaderName, `${func} von ${valHeaderName}`]
            ];

            for (let group in groups) {
                const arr = groups[group];
                let res = 0;

                if (func === 'SUM') res = arr.reduce((a, b) => a + b, 0);
                if (func === 'AVG') res = arr.length ? (arr.reduce((a, b) => a + b, 0) / arr.length).toFixed(2) : 0;
                if (func === 'COUNT') res = arr.length;
                if (func === 'MIN') res = arr.length ? Math.min(...arr) : 0;
                if (func === 'MAX') res = arr.length ? Math.max(...arr) : 0;

                body.innerHTML += `<tr class="border-b dark:border-gray-700"><td class="p-2 font-medium">${group}</td><td class="p-2">${res}</td></tr>`;
                currentPivotResult.push([group, res]);
            }

            document.getElementById('pivot-result-container').classList.remove('hidden');
            document.getElementById('pivot-export-btn').classList.remove('hidden');
        }

        function exportPivotToSheet() {
            if (!currentPivotResult) return;
            const pivotSheetName = `Pivot_${Object.keys(sheets).length + 1}`;
            sheets[pivotSheetName] = createEmptySheet();

            currentPivotResult.forEach((row, r) => {
                row.forEach((val, c) => {
                    sheets[pivotSheetName].data[`${r}_${c}`] = val;
                });
            });

            activeSheetName = pivotSheetName;
            renderTabs();
            renderGrid();
            closePivotModal();
        }

        // SheetJS File Import Handling (.xlsx, .csv)
        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array' });

                sheets = {};
                workbook.SheetNames.forEach(name => {
                    const worksheet = workbook.Sheets[name];
                    const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                    
                    sheets[name] = createEmptySheet();
                    json.forEach((row, r) => {
                        row.forEach((val, c) => {
                            sheets[name].data[`${r}_${c}`] = val;
                        });
                    });
                });

                activeSheetName = workbook.SheetNames[0];
                renderTabs();
                renderGrid();
            };
            reader.readAsArrayBuffer(file);
        });

        // Open Export Modal
        function openExportModal() { document.getElementById('export-modal').classList.remove('hidden'); }
        function closeExportModal() { document.getElementById('export-modal').classList.add('hidden'); }

        // Mobile Optimized File Download Logic (iOS / Android / Desktop safe)
        function triggerDownload(format) {
            const filenameInput = document.getElementById('export-filename').value || 'Meine_Tabelle';
            const filename = `${filenameInput}.${format}`;

            // Build SheetJS Workbook
            const wb = XLSX.utils.book_new();
            for (let name in sheets) {
                let sheetArray = [];
                for (let r = 0; r < INITIAL_ROWS; r++) {
                    let row = [];
                    for (let c = 0; c < INITIAL_COLS; c++) {
                        const val = sheets[name].data[`${r}_${c}`] || '';
                        row.push(evaluateCell(val));
                    }
                    sheetArray.push(row);
                }
                const ws = XLSX.utils.aoa_to_sheet(sheetArray);
                XLSX.utils.book_append_sheet(wb, ws, name);
            }

            if (format === 'xlsx') {
                XLSX.writeFile(wb, filename);
            } else if (format === 'csv') {
                XLSX.writeFile(wb, filename, { bookType: 'csv' });
            }
            closeExportModal();
        }

        // Sheet Tabs Engine
        function renderTabs() {
            const container = document.getElementById('sheet-tabs');
            container.innerHTML = '';

            for (let name in sheets) {
                const isActive = name === activeSheetName;
                const activeClasses = isActive 
                    ? 'bg-white dark:bg-gray-900 text-emerald-700 dark:text-emerald-400 font-bold border-t-2 border-emerald-600' 
                    : 'bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-300';

                container.innerHTML += `
                    <div class="flex items-center px-3 py-1 rounded-t text-xs cursor-pointer ${activeClasses}" onclick="switchSheet('${name}')">
                        <span>${name}</span>
                        ${Object.keys(sheets).length > 1 ? `<i class="fa-solid fa-xmark ml-2 hover:text-red-500" onclick="event.stopPropagation(); deleteSheet('${name}')"></i>` : ''}
                    </div>
                `;
            }
        }

        function switchSheet(name) {
            activeSheetName = name;
            renderTabs();
            renderGrid();
        }

        function addNewSheet() {
            const name = `Blatt ${Object.keys(sheets).length + 1}`;
            sheets[name] = createEmptySheet();
            switchSheet(name);
        }

        function deleteSheet(name) {
            if (Object.keys(sheets).length <= 1) return;
            delete sheets[name];
            activeSheetName = Object.keys(sheets)[0];
            renderTabs();
            renderGrid();
        }

        // Dark Mode Toggle Function
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }

        // Load Default Sample Spreadsheet Data
        function loadSampleData() {
            const sample = [
                ["Produkt", "Kategorie", "Menge", "Einzelpreis", "Gesamtpreis"],
                ["Äpfel", "Obst", 10, 2.50, "=C2*D2"],
                ["Brot", "Backwaren", 5, 3.00, "=C3*D3"],
                ["Milch", "Molkerei", 8, 1.20, "=C4*D4"],
                ["Käse", "Molkerei", 3, 4.50, "=C5*D5"],
                ["Birnen", "Obst", 12, 2.00, "=C6*D6"],
                ["Summe", "", "", "", "=SUMME(E2:E6)"]
            ];

            sample.forEach((row, r) => {
                row.forEach((val, c) => {
                    sheets['Blatt 1'].data[`${r}_${c}`] = val;
                });
            });

            // Sample formatting header bold
            for (let c = 0; c < 5; c++) {
                sheets['Blatt 1'].formatting[`0_${c}`] = { bold: true, backgroundColor: '#d1fae5' };
            }
            sheets['Blatt 1'].formatting[`6_0`] = { bold: true };
            sheets['Blatt 1'].formatting[`6_4`] = { bold: true };

            renderGrid();
        }
    </script>
