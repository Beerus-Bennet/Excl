<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Excel.net</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#0d1b2a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Excel.net">
    
    <!-- App Icons & Manifest -->
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href='data:application/manifest+json,{
      "name": "Excel.net",
      "short_name": "Excel.net",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#0d1b2a",
      "theme_color": "#0d1b2a",
      "icons": [
        {"src": "icon.png", "sizes": "192x192", "type": "image/png"},
        {"src": "icon.png", "sizes": "512x512", "type": "image/png"}
      ]
    }'>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Luckysheet Standard CSS Dependencies -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/plugins/css/pluginsCss.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/plugins/plugins.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/css/luckysheet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/assets/iconfont/iconfont.css" />

    <!-- jQuery, Luckysheet JS & Export Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/plugins/js/plugin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/luckysheet.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luckyexcel@1.0.1/dist/luckyexcel.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg-dark: #0d1b2a;
            --bg-header: #152232;
            --bg-ribbon: #1b2838;
            --bg-button: #24364e;
            --accent-cyan: #00b4d8;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: rgba(0, 180, 216, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
        }

        #app-wrapper {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            height: -webkit-fill-available;
        }

        /* Top Header with iOS Safe Area Notch Padding */
        header.top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-header);
            padding-top: max(8px, env(safe-area-inset-top));
            padding-bottom: 8px;
            padding-left: max(12px, env(safe-area-inset-left));
            padding-right: max(12px, env(safe-area-inset-right));
            border-bottom: 1px solid var(--border-color);
            gap: 10px;
            flex-shrink: 0;
            z-index: 100;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .brand-logo-img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid var(--accent-cyan);
            background-color: #102238;
            flex-shrink: 0;
        }

        .brand-name {
            font-size: 1.1rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.2px;
        }

        .brand-name span { color: var(--accent-cyan); }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .app-btn {
            background-color: var(--accent-cyan);
            color: var(--bg-dark);
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            touch-action: manipulation;
        }

        .app-btn-outline {
            background-color: var(--bg-button);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .app-btn:active { opacity: 0.8; transform: scale(0.98); }
        #file-input { display: none; }

        /* Ribbon Navigation Tabs */
        .ribbon-tabs-nav {
            display: flex;
            background-color: var(--bg-dark);
            padding: 0 8px;
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x;
            scrollbar-width: none;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .ribbon-tabs-nav::-webkit-scrollbar { display: none; }

        .tab-btn {
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            background: none;
            border: none;
            border-bottom: 2.5px solid transparent;
            cursor: pointer;
            white-space: nowrap;
            display: inline-block;
        }

        .tab-btn.active {
            color: var(--accent-cyan);
            border-bottom-color: var(--accent-cyan);
            background-color: rgba(0, 180, 216, 0.1);
        }

        /* Compact Ribbon Toolbar without unbounded blank space */
        .ribbon-toolbar-wrapper {
            display: flex;
            align-items: center;
            background-color: var(--bg-ribbon);
            border-bottom: 1px solid var(--border-color);
            min-height: 42px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .ribbon-toolbar-content {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x;
            scrollbar-width: none;
            width: 100%;
        }
        .ribbon-toolbar-content::-webkit-scrollbar { display: none; }

        .toolbar-group {
            display: none;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            width: auto;
        }
        .toolbar-group.active { display: flex; }

        .tool-action-btn {
            background-color: var(--bg-button);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            touch-action: manipulation;
        }

        .tool-action-btn i { color: var(--accent-cyan); }
        .tool-action-btn:active { background-color: var(--accent-cyan); color: var(--bg-dark); }
        .tool-action-btn:active i { color: var(--bg-dark); }

        /* Luckysheet Workspace Container */
        #grid-container {
            flex: 1;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        #luckysheet {
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
        }

        /* Clean up unwanted Luckysheet top bars & double logos */
        .luckysheet-share-logo, 
        .luckysheet-title-outer, 
        #luckysheet-wa-editor {
            display: none !important;
        }

        /* Ensure bottom sheet tabs & status bar stay above mobile gesture bar */
        #luckysheet-sheet-area {
            padding-bottom: env(safe-area-inset-bottom) !important;
            background-color: #f8f9fa !important;
        }
    </style>
</head>
<body>

    <div id="app-wrapper">
        <!-- Top Header with Native icon.png Logo -->
        <header class="top-header">
            <div class="brand-box">
                <img src="icon.png" alt="Excel.net Logo" class="brand-logo-img" onerror="this.style.display='none'">
                <div class="brand-name">Excel<span>.net</span></div>
            </div>

            <div class="header-actions">
                <button class="app-btn app-btn-outline" onclick="document.getElementById('file-input').click()">
                    <i class="fa-solid fa-folder-open"></i> Öffnen
                </button>
                <input type="file" id="file-input" accept=".xlsx, .xls, .csv" onchange="importFile(event)">

                <button class="app-btn" onclick="exportXLSX()">
                    <i class="fa-solid fa-file-excel"></i> Speichern (.xlsx)
                </button>
            </div>
        </header>

        <!-- Ribbon Navigation Tabs -->
        <div class="ribbon-tabs-nav">
            <button class="tab-btn active" onclick="switchRibbonTab(this, 'tab-start')">Start</button>
            <button class="tab-btn" onclick="switchRibbonTab(this, 'tab-insert')">Einfügen</button>
            <button class="tab-btn" onclick="switchRibbonTab(this, 'tab-formulas')">Formeln</button>
            <button class="tab-btn" onclick="switchRibbonTab(this, 'tab-data')">Daten</button>
            <button class="tab-btn" onclick="switchRibbonTab(this, 'tab-view')">Ansicht</button>
        </div>

        <!-- Ribbon Toolbar Controls -->
        <div class="ribbon-toolbar-wrapper">
            <div class="ribbon-toolbar-content">
                <!-- Tab: Start -->
                <div id="tab-start" class="toolbar-group active">
                    <button class="tool-action-btn" onclick="executeLuckysheetCmd('undo')"><i class="fa-solid fa-rotate-left"></i> Rückgängig</button>
                    <button class="tool-action-btn" onclick="executeLuckysheetCmd('redo')"><i class="fa-solid fa-rotate-right"></i> Wiederholen</button>
                    <button class="tool-action-btn" onclick="executeLuckysheetCmd('bold')"><i class="fa-solid fa-bold"></i> Fett</button>
                    <button class="tool-action-btn" onclick="executeLuckysheetCmd('italic')"><i class="fa-solid fa-italic"></i> Kursiv</button>
                </div>

                <!-- Tab: Einfügen -->
                <div id="tab-insert" class="toolbar-group">
                    <button class="tool-action-btn" onclick="insertRow()"><i class="fa-solid fa-table-rows"></i> Zeile oberhalb</button>
                    <button class="tool-action-btn" onclick="insertCol()"><i class="fa-solid fa-table-columns"></i> Spalte links</button>
                </div>

                <!-- Tab: Formeln -->
                <div id="tab-formulas" class="toolbar-group">
                    <button class="tool-action-btn" onclick="insertFormula('SUM')"><i class="fa-solid fa-calculator"></i> SUMME</button>
                    <button class="tool-action-btn" onclick="insertFormula('AVERAGE')"><i class="fa-solid fa-chart-line"></i> MITTELWERT</button>
                    <button class="tool-action-btn" onclick="insertFormula('COUNT')"><i class="fa-solid fa-hashtag"></i> ANZAHL</button>
                </div>

                <!-- Tab: Daten -->
                <div id="tab-data" class="toolbar-group">
                    <button class="tool-action-btn" onclick="sortData('asc')"><i class="fa-solid fa-arrow-down-a-z"></i> Sortieren A-Z</button>
                    <button class="tool-action-btn" onclick="sortData('desc')"><i class="fa-solid fa-arrow-up-z-a"></i> Sortieren Z-A</button>
                </div>

                <!-- Tab: Ansicht -->
                <div id="tab-view" class="toolbar-group">
                    <button class="tool-action-btn" onclick="setZoom(1.2)"><i class="fa-solid fa-magnifying-glass-plus"></i> Vergrößern</button>
                    <button class="tool-action-btn" onclick="setZoom(1.0)"><i class="fa-solid fa-rotate"></i> 100% Zoom</button>
                </div>
            </div>
        </div>

        <!-- Grid Workspace (Luckysheet renders its own native formula bar underneath the toolbar) -->
        <div id="grid-container">
            <div id="luckysheet"></div>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            luckysheet.create({
                container: 'luckysheet',
                title: 'Excel.net Tabelle',
                lang: 'en',
                showtoolbar: false,
                showinfobar: false,
                showsheetbar: true,
                showstatisticBar: true,
                enableAddRow: true,
                enableAddBackTop: false,
                userInfo: false,
                gridKey: 'excel_net_grid_key'
            });
        });

        function switchRibbonTab(buttonEl, tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.toolbar-group').forEach(group => group.classList.remove('active'));

            buttonEl.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        function executeLuckysheetCmd(cmd) {
            if (cmd === 'undo') luckysheet.undo();
            else if (cmd === 'redo') luckysheet.redo();
            else if (cmd === 'bold') luckysheet.setFontBold();
            else if (cmd === 'italic') luckysheet.setFontItalic();
        }

        function insertRow() { luckysheet.insertRow(); }
        function insertCol() { luckysheet.insertColumn(); }

        function insertFormula(fnName) {
            let range = luckysheet.getSelectRange();
            if (range && range.length > 0) {
                let r = range[0].row[0];
                let c = range[0].column[0];
                luckysheet.setCellValue(r, c, `=${fnName}()`);
            }
        }

        function sortData(order) { luckysheet.sortSelection(order === 'asc'); }
        function setZoom(factor) { luckysheet.setZoomRatio(factor); }

        function importFile(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;
            let file = files[0];

            if (file.name.endsWith('.csv')) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    let celldata = [];
                    jsonData.forEach((row, r) => {
                        row.forEach((val, c) => {
                            if (val !== null && val !== undefined) {
                                celldata.push({ r: r, c: c, v: { v: val, m: String(val) } });
                            }
                        });
                    });

                    luckysheet.destroy();
                    luckysheet.create({
                        container: 'luckysheet',
                        title: file.name.replace(/\.[^/.]+$/, ""),
                        data: [{ name: firstSheetName, status: "1", order: "0", celldata: celldata }],
                        showtoolbar: false,
                        showinfobar: false
                    });
                };
                reader.readAsArrayBuffer(file);
                return;
            }

            LuckyExcel.transformExcelToLucky(file, function (exportJson) {
                if (!exportJson.sheets || exportJson.sheets.length === 0) {
                    alert("Konnte Datei nicht öffnen.");
                    return;
                }
                luckysheet.destroy();
                luckysheet.create({
                    container: 'luckysheet',
                    title: exportJson.info.name || "Excel.net Tabelle",
                    data: exportJson.sheets,
                    userInfo: false,
                    showtoolbar: false,
                    showinfobar: false
                });
            });
        }

        async function downloadFilePWA(blob, filename) {
            const file = new File([blob], filename, { type: blob.type });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        files: [file],
                        title: filename
                    });
                    return;
                } catch (e) {
                    console.log("Share skipped, falling back to download link...", e);
                }
            }

            const reader = new FileReader();
            reader.onloadend = function () {
                const dataUrl = reader.result;
                const a = document.createElement('a');
                a.href = dataUrl;
                a.download = filename;
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                setTimeout(() => document.body.removeChild(a), 1000);
            };
            reader.readAsDataURL(blob);
        }

        function exportXLSX() {
            try {
                const sheetData = luckysheet.getluckysheetfile();
                if (!sheetData) return;
                let wb = XLSX.utils.book_new();

                sheetData.forEach(sheet => {
                    let data = luckysheet.getgetwaydata(sheet.data);
                    let ws = XLSX.utils.aoa_to_sheet(data);
                    XLSX.utils.book_append_sheet(wb, ws, sheet.name || "Tabelle1");
                });

                const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
                const blob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                
                downloadFilePWA(blob, "Excel.net_Tabelle.xlsx");
            } catch (e) {
                alert("Fehler beim Exportieren: " + e.message);
            }
        }
    </script>
</body>
</html>
