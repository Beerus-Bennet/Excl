<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Excel.net</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0d1b2a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Excel.net">
    
    <!-- App Icons -->
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    
    <!-- Luckysheet CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/plugins/css/pluginsCss.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/plugins/plugins.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/css/luckysheet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/assets/iconfont/iconfont.css" />
    
    <!-- Luckysheet JS -->
    <script src="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/plugins/js/plugin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/luckysheet.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luckyexcel@1.0.1/dist/luckyexcel.umd.js"></script>

    <style>
        :root {
            --bg-dark: #0d1b2a;
            --bg-header: #152232;
            --accent-cyan: #00b4d8;
            --accent-blue: #0077b6;
            --border-color: #2b3a4e;
            --text-light: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-light);
        }

        #app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: -webkit-fill-available;
            width: 100vw;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-header);
            padding: max(8px, env(safe-area-inset-top)) 12px 8px 12px;
            border-bottom: 1px solid var(--border-color);
            gap: 8px;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .brand-logo {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid var(--accent-cyan);
        }

        .brand h1 {
            font-size: 1.1rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .brand h1 span {
            color: var(--accent-cyan);
        }

        .header-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .sheet-wrapper {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
        }

        #luckysheet {
            margin: 0;
            padding: 0;
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0px;
            top: 0px;
        }

        /* Styling Fixes */
        .luckysheet-input-box {
            color: #000000 !important;
            background-color: #ffffff !important;
        }

        .luckysheet-share-logo { display: none !important; }
        .luckysheet_info_detail { display: none !important; }
        #file-input { display: none; }
    </style>
</head>
<body>

<div id="app-container">
    <header>
        <div class="brand">
            <img class="brand-logo" src="icon.png" alt="Logo" onerror="this.style.display='none'">
            <h1>Excel<span>.net</span></h1>
        </div>
        <div class="header-actions">
            <button class="btn btn-outline" onclick="document.getElementById('file-input').click()">📁 Öffnen</button>
            <input type="file" id="file-input" accept=".xlsx, .csv" onchange="importFile(event)">
            <button class="btn" onclick="exportXLSX()">💾 Speichern (.xlsx)</button>
        </div>
    </header>

    <div class="sheet-wrapper">
        <div id="luckysheet"></div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        luckysheet.create({
            container: 'luckysheet',
            title: 'Excel.net',
            lang: 'de',
            showtoolbar: true,
            showinfobar: false,
            showsheetbar: true,
            showstatisticBar: true,
            enableAddRow: true,
            enableAddBackTop: false,
            userInfo: false
        });
    });

    function importFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        Luckyexcel.transformExcelToLucky(file, function(exportJson) {
            if (!exportJson.sheets || exportJson.sheets.length === 0) {
                alert("Datei konnte nicht geladen werden.");
                return;
            }
            luckysheet.destroy();
            luckysheet.create({
                container: 'luckysheet',
                title: file.name.replace(/\.[^/.]+$/, ""),
                lang: 'de',
                data: exportJson.sheets,
                showtoolbar: true,
                showinfobar: false,
                showsheetbar: true,
                showstatisticBar: true
            });
        });
    }

    async function exportXLSX() {
        const sheets = luckysheet.getluckysheetfile();
        if (!sheets) return;

        const blob = new Blob([JSON.stringify(sheets)], {type: 'application/json'});
        const file = new File([blob], "Excel.net_Export.json", {type: 'application/json'});

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
                await navigator.share({
                    files: [file],
                    title: 'Excel.net Export',
                    text: 'Hier ist deine Excel.net Datei'
                });
            } catch (err) {
                console.log("Teilen abgebrochen", err);
            }
        } else {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "Excel.net_Export.json";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    }
</script>
</body>
</html>
