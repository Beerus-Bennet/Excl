<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Excel.net</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0d1b2a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Excel.net">
    
    <!-- App Icons -->
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    
    <!-- Lightweight Spreadsheet Engine (Handsontable Standalone) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.css">
    <script src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <style>
        :root {
            --bg-dark: #0d1b2a;
            --bg-header: #152232;
            --accent-cyan: #00b4d8;
            --accent-blue: #0077b6;
            --border-color: #2b3a4e;
            --text-light: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-light);
        }

        #app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-header);
            padding: max(8px, env(safe-area-inset-top)) 12px 8px 12px;
            border-bottom: 1px solid var(--border-color);
            gap: 8px;
            z-index: 1000;
            flex-shrink: 0;
            height: 56px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid var(--accent-cyan);
        }

        .brand h1 {
            font-size: 1.1rem;
            font-weight: 800;
            color: #ffffff;
        }

        .brand h1 span {
            color: var(--accent-cyan);
        }

        .header-actions {
            display: flex;
            gap: 6px;
        }

        .btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
        }

        #spreadsheet-container {
            flex: 1;
            width: 100%;
            height: calc(100vh - 56px);
            overflow: hidden;
            background: #ffffff;
        }

        #file-input { display: none; }

        /* Handsontable Mobile Touch Adjustments */
        .handsontable {
            font-size: 14px;
        }
        .handsontable td {
            color: #000000 !important;
        }
    </style>
</head>
<body>

<div id="app-container">
    <header>
        <div class="brand">
            <img class="brand-logo" src="icon.png" alt="Logo" onerror="this.style.display='none'">
            <h1>Excel<span>.net</span></h1>
        </div>
        <div class="header-actions">
            <button class="btn btn-outline" onclick="document.getElementById('file-input').click()">📁 Öffnen</button>
            <input type="file" id="file-input" accept=".csv, .txt" onchange="importCSV(event)">
            <button class="btn" onclick="exportCSV()">💾 Speichern (.csv)</button>
        </div>
    </header>

    <div id="spreadsheet-container"></div>
</div>

<script>
    let hot = null;

    // Standard-Datensatz beim Erstellen erzeugen (100 Zeilen, 26 Spalten A-Z)
    const initialData = Handsontable.helper.createEmptySpreadsheetData(100, 26);

    document.addEventListener("DOMContentLoaded", function() {
        const container = document.getElementById('spreadsheet-container');
        
        hot = new Handsontable(container, {
            data: initialData,
            rowHeaders: true,
            colHeaders: true,
            height: '100%',
            width: '100%',
            licenseKey: 'non-commercial-and-evaluation',
            contextMenu: true,
            manualColumnResize: true,
            manualRowResize: true,
            dropdownMenu: true,
            filters: true,
            autoWrapRow: true,
            autoWrapCol: true
        });
    });

    // CSV / Datei Importieren
    function importCSV(event) {
        const file = event.target.files[0];
        if (!file) return;

        Papa.parse(file, {
            complete: function(results) {
                if (results.data && results.data.length > 0) {
                    hot.loadData(results.data);
                } else {
                    alert("Datei ist leer oder hat ein ungültiges Format.");
                }
            },
            error: function() {
                alert("Fehler beim Lesen der Datei.");
            }
        });
    }

    // CSV Exportieren / Teilen
    async function exportCSV() {
        if (!hot) return;
        const data = hot.getData();
        const csvString = Papa.unparse(data);

        const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
        const file = new File([blob], "Excel.net_Tabelle.csv", { type: 'text/csv' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
                await navigator.share({
                    files: [file],
                    title: 'Excel.net Export',
                    text: 'Hier ist deine Excel.net Tabelle'
                });
            } catch (err) {
                console.log("Teilen abgebrochen", err);
            }
        } else {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "Excel.net_Tabelle.csv";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    }
</script>
</body>
</html>
