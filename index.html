<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Excel.net</title>
    
    <!-- PWA & Favicon -->
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="theme-color" content="#1b2a47">

    <!-- Luckysheet / FortuneSheet CSS & JS (Excel-Engine) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/plugins/css/pluginsCss.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/plugins/plugins.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/css/luckysheet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/assets/iconfont/iconfont.css" />

    <!-- PivotTable.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pivottable/2.23.0/pivot.min.css" />

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        #app { display: flex; flex-direction: column; height: 100vh; }
        
        /* Header & Navigation */
        header { 
            background-color: #1b2a47; 
            color: white; 
            padding: 8px 15px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
        }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .brand h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.5px; }

        /* Toolbar für Desktop & Mobile */
        .actions { display: flex; gap: 8px; align-items: center; }
        .btn {
            background: #2a3f66;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
        }
        .btn:hover { background: #3b578d; }
        .btn-primary { background: #00a884; }
        .btn-primary:hover { background: #008f70; }
        
        #file-input { display: none; }

        /* Container für Spreadsheet & Pivot */
        #main-content { flex: 1; position: relative; width: 100%; height: calc(100vh - 50px); }
        #luckysheet { margin: 0px; padding: 0px; position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; }

        /* Modal für Pivot-Tabellen */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #fff;
            width: 90%;
            height: 85%;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .modal-header {
            padding: 12px 20px;
            background: #1b2a47;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-body { flex: 1; padding: 15px; overflow: auto; }
        .close-btn { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }

        /* Mobile Optimierungen */
        @media (max-width: 768px) {
            .brand h1 { font-size: 0.95rem; }
            .btn span { display: none; } /* Versteckt Text auf Mobilgeräten für kompaktere Buttons */
            .btn { padding: 6px 8px; }
        }
    </style>
</head>
<body>

<div id="app">
    <header>
        <div class="brand">
            <img src="icon.png" alt="Excel.net Icon" id="app-logo">
            <h1>Excel.net</h1>
        </div>
        <div class="actions">
            <label for="file-input" class="btn">
                📁 <span>Öffnen (.xlsx / .csv)</span>
            </label>
            <input type="file" id="file-input" accept=".xlsx, .csv">
            
            <button class="btn" onclick="exportData('xlsx')">💾 <span>XLSX</span></button>
            <button class="btn" onclick="exportData('csv')">📄 <span>CSV</span></button>
            <button class="btn btn-primary" onclick="openPivotModal()">📊 <span>Pivot</span></button>
        </div>
    </header>

    <div id="main-content">
        <div id="luckysheet"></div>
    </div>
</div>

<!-- Pivot Modal -->
<div id="pivotModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Excel.net - Pivottabelle</h3>
            <button class="close-btn" onclick="closePivotModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div id="pivot-output">Lade Daten für Pivot-Analyse...</div>
        </div>
    </div>
</div>

<!-- Core Scripts -->
<script src="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/plugins/js/plugin.js"></script>
<script src="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/luckysheet.umd.js"></script>
<!-- SheetJS & Luckyexcel für XLSX Import/Export -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/luckyexcel@1.0.1/dist/luckyexcel.umd.js"></script>
<!-- jQuery & PivotTable.js -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pivottable/2.23.0/pivot.min.js"></script>

<script>
    // 1. Luckysheet initialisieren
    $(document).ready(function () {
        const options = {
            container: 'luckysheet',
            title: 'Excel.net Arbeitsmappe',
            lang: 'zh', // Standardsprache, UI wird automatisch geladen
            showinfobar: false,
            myFolderUrl: '#',
            allowUpdate: false,
            enableAddRow: true,
            enableAddBackTop: true,
            userInfo: false
        };
        luckysheet.create(options);
    });

    // 2. CSV & XLSX Import
    document.getElementById('file-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const fileName = file.name;
        const ext = fileName.split('.').pop().toLowerCase();

        if (ext === 'xlsx') {
            LuckyExcel.transformExcelToLucky(file, function(exportJson) {
                if (exportJson.sheets == null || exportJson.sheets.length == 0) {
                    alert("Die Datei konnte nicht gelesen werden.");
                    return;
                }
                luckysheet.destroy();
                luckysheet.create({
                    container: 'luckysheet',
                    data: exportJson.sheets,
                    title: exportJson.info.name
                });
            });
        } else if (ext === 'csv') {
            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = evt.target.result;
                const workbook = XLSX.read(data, {type: 'string'});
                const sheetName = workbook.SheetNames[0];
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {header: 1});

                // Formatierung für Luckysheet vorbereiten
                let celldata = [];
                json.forEach((row, r) => {
                    row.forEach((val, c) => {
                        celldata.push({ r: r, c: c, v: { v: val, m: String(val) } });
                    });
                });

                luckysheet.destroy();
                luckysheet.create({
                    container: 'luckysheet',
                    data: [{ name: "CSV Import", celldata: celldata }]
                });
            };
            reader.readAsText(file);
        }
    });

    // 3. Export-Funktion für XLSX und CSV
    function exportData(type) {
        const sheetData = luckysheet.getSheetData();
        let simpleMatrix = [];

        for (let r = 0; r < sheetData.length; r++) {
            let row = [];
            let hasValue = false;
            for (let c = 0; c < sheetData[r].length; c++) {
                let cell = sheetData[r][c];
                let val = (cell && cell.v !== undefined && cell.v !== null) ? cell.v : "";
                if (val !== "") hasValue = true;
                row.push(val);
            }
            if (hasValue) simpleMatrix.push(row);
        }

        const ws = XLSX.utils.aoa_to_sheet(simpleMatrix);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Excel.net Sheet");

        if (type === 'xlsx') {
            XLSX.writeFile(wb, "Excel_net_Export.xlsx");
        } else if (type === 'csv') {
            XLSX.writeFile(wb, "Excel_net_Export.csv", { bookType: "csv" });
        }
    }

    // 4. Pivottabellen-Generator
    function openPivotModal() {
        const sheetData = luckysheet.getSheetData();
        let arrayData = [];

        for (let r = 0; r < sheetData.length; r++) {
            let row = [];
            let hasValue = false;
            for (let c = 0; c < sheetData[r].length; c++) {
                let cell = sheetData[r][c];
                let val = (cell && cell.v !== undefined && cell.v !== null) ? cell.v : "";
                if (val !== "") hasValue = true;
                row.push(val);
            }
            if (hasValue) arrayData.push(row);
        }

        if (arrayData.length < 2) {
            alert("Nicht genügend Daten für eine Pivot-Analyse vorhanden (mindestens Überschrift + 1 Datenzeile erforderlich).");
            return;
        }

        document.getElementById('pivotModal').style.display = 'flex';

        // PivotTable.js Rendering
        $("#pivot-output").pivotUI(arrayData, {
            rows: [],
            cols: []
        });
    }

    function closePivotModal() {
        document.getElementById('pivotModal').style.display = 'none';
    }
</script>

</body>
</html>
