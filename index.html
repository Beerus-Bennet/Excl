<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Excel.net</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#0d1b2a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Excel.net">
    
    <!-- Apple Touch Icons & Favicons (Fixes Home Screen Distortion) -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
    <link rel="apple-touch-icon-precomposed" href="icon.png">
    
    <!-- Web App Manifest -->
    <link rel="manifest" href='data:application/manifest+json,{
      "name": "Excel.net",
      "short_name": "Excel.net",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#0d1b2a",
      "theme_color": "#0d1b2a",
      "icons": [
        {"src": "icon.png", "sizes": "180x180", "type": "image/png", "purpose": "any maskable"},
        {"src": "icon.png", "sizes": "192x192", "type": "image/png", "purpose": "any maskable"},
        {"src": "icon.png", "sizes": "512x512", "type": "image/png", "purpose": "any maskable"}
      ]
    }'>

    <!-- Luckysheet Standard CSS Dependencies -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/plugins/css/pluginsCss.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/plugins/plugins.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/css/luckysheet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/assets/iconfont/iconfont.css" />

    <!-- Luckysheet JS, Luckyexcel & SheetJS Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/plugins/js/plugin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/luckysheet.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luckyexcel@1.0.1/dist/luckyexcel.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- Custom Styling & Theme Customization -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1b2a;
            color: #f8fafc;
        }

        #app-wrapper {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            height: -webkit-fill-available;
        }

        /* Top Header Bar */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #0d1b2a;
            padding: 8px 16px;
            border-bottom: 2px solid #00b4d8;
            gap: 12px;
            z-index: 1000;
            flex-wrap: nowrap;
            height: 56px;
            min-height: 56px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 130px;
        }

        /* Fixed Icon Aspect Ratio to prevent distortion */
        .brand-logo {
            width: 34px;
            height: 34px;
            min-width: 34px;
            min-height: 34px;
            max-width: 34px;
            max-height: 34px;
            border-radius: 50%;
            object-fit: cover;
            aspect-ratio: 1 / 1;
            border: 1.5px solid #00b4d8;
            box-shadow: 0 0 8px rgba(0, 180, 216, 0.4);
            background-color: #1b263b;
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.3px;
            white-space: nowrap;
        }

        .brand-title span {
            color: #00b4d8;
        }

        .action-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .action-toolbar::-webkit-scrollbar {
            display: none;
        }

        .btn {
            background-color: #00b4d8;
            color: #0d1b2a;
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 2px 5px rgba(0, 180, 216, 0.25);
        }

        .btn:active {
            transform: scale(0.96);
            background-color: #38bdf8;
        }

        .btn-outline {
            background-color: #1b263b;
            color: #e2e8f0;
            border: 1px solid rgba(0, 180, 216, 0.4);
            box-shadow: none;
        }

        .btn-outline:active {
            background-color: #24364e;
            border-color: #00b4d8;
        }

        #file-input {
            display: none;
        }

        /* Luckysheet Workspace Container */
        #luckysheet-outer-container {
            position: relative;
            flex: 1;
            width: 100%;
            height: calc(100vh - 56px);
            overflow: hidden;
        }

        #luckysheet {
            margin: 0px;
            padding: 0px;
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0px;
            top: 0px;
        }

        /* Overrides to clean up default Luckysheet branding elements */
        .luckysheet-share-logo {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="app-wrapper">
        <!-- Header Controls -->
        <header>
            <div class="brand-container">
                <img src="icon.png" class="brand-logo" alt="BE" onerror="this.onerror=null; this.src='https://placehold.co/100x100/0d1b2a/00b4d8?text=BE';">
                <div class="brand-title">Excel<span>.net</span></div>
            </div>
            <div class="action-toolbar">
                <button class="btn btn-outline" onclick="document.getElementById('file-input').click()">
                    📁 Datei öffnen
                </button>
                <input type="file" id="file-input" accept=".xlsx, .xls, .csv" onchange="importXLSX(event)">

                <button class="btn" onclick="exportXLSX()">
                    💾 Speichern (.xlsx)
                </button>
                <button class="btn btn-outline" onclick="exportCSV()">
                    📄 Speichern (.csv)
                </button>
            </div>
        </header>

        <!-- Main Luckysheet Grid Container -->
        <div id="luckysheet-outer-container">
            <div id="luckysheet"></div>
        </div>
    </div>

    <!-- Application Script Engine -->
    <script>
        // Initialize Full Luckysheet Engine on DOM Load
        $(document).ready(function () {
            options = {
                container: 'luckysheet',
                title: 'Excel.net Tabelle',
                lang: 'en', // International standard layout
                showinfobar: false,
                showsheetbar: true,
                showstatisticBar: true,
                enableAddRow: true,
                enableAddBackTop: true,
                userInfo: false,
                gridKey: 'excel_net_pwa_grid',
                allowUpdate: true,
                forceCalculation: true
            };
            
            luckysheet.create(options);
        });

        // Native XLSX & XLS File Import via Luckyexcel
        function importXLSX(event) {
            const files = event.target.files;
            if (files == null || files.length == 0) {
                return;
            }
            let item = files[0];
            
            // Handle CSV Import via SheetJS
            if (item.name.endsWith('.csv')) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    let celldata = [];
                    jsonData.forEach((row, r) => {
                        row.forEach((val, c) => {
                            if (val !== null && val !== undefined) {
                                celldata.push({
                                    r: r,
                                    c: c,
                                    v: { v: val, m: String(val) }
                                });
                            }
                        });
                    });

                    luckysheet.destroy();
                    luckysheet.create({
                        container: 'luckysheet',
                        title: item.name.replace(/\.[^/.]+$/, ""),
                        data: [{
                            name: firstSheetName,
                            status: "1",
                            order: "0",
                            celldata: celldata
                        }]
                    });
                };
                reader.readAsArrayBuffer(item);
                return;
            }

            // Handle Native Excel Files (.xlsx)
            LuckyExcel.transformExcelToLucky(item, function (exportJson, luckysheetfile) {
                if (exportJson.sheets == null || exportJson.sheets.length == 0) {
                    alert("Datei konnte nicht gelesen werden!");
                    return;
                }

                luckysheet.destroy();
                luckysheet.create({
                    container: 'luckysheet',
                    title: exportJson.info.name || "Excel.net Tabelle",
                    data: exportJson.sheets,
                    userInfo: false,
                    showinfobar: false
                });
            }, function (err) {
                alert("Fehler beim Laden der Excel-Datei: " + err);
            });
        }

        // Native XLSX File Export using SheetJS
        function exportXLSX() {
            try {
                const sheetData = luckysheet.getluckysheetfile();
                if(!sheetData) return;

                let wb = XLSX.utils.book_new();

                sheetData.forEach(sheet => {
                    let data = luckysheet.getgetwaydata(sheet.data);
                    let ws = XLSX.utils.aoa_to_sheet(data);
                    XLSX.utils.book_append_sheet(wb, ws, sheet.name || "Tabelle1");
                });

                XLSX.writeFile(wb, "Excel.net_Tabelle.xlsx");
            } catch (e) {
                console.error("XLSX Export Error: ", e);
                alert("Fehler beim Exportieren der Datei.");
            }
        }

        // CSV File Export
        function exportCSV() {
            try {
                const sheetData = luckysheet.getluckysheetfile()[0];
                let data = luckysheet.getgetwaydata(sheetData.data);
                let ws = XLSX.utils.aoa_to_sheet(data);
                let csv = XLSX.utils.sheet_to_csv(ws);

                let blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
                let link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.setAttribute("download", "Excel.net_Tabelle.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (e) {
                console.error("CSV Export Error: ", e);
                alert("Fehler beim Erstellen der CSV-Datei.");
            }
        }
    </script>
</body>
</html>
